name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build offline HTML
        run: npm run build

      - name: Verify committed HTML matches source
        run: |
          git ls-files --error-unmatch -- dist/word-to-markdown.html
          if ! git diff --exit-code -- dist/word-to-markdown.html; then
            echo '::error::Run npm run build and commit dist/word-to-markdown.html with the source changes.'
            exit 1
          fi

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run offline browser acceptance tests
        run: npm run test:ci

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified offline HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: word-to-markdown
          path: dist/word-to-markdown.html
          if-no-files-found: error
          retention-days: 14
